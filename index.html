<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koshikawa Research Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#ffffff; --surface:#f5f5f3; --surface2:#ebeae6; --ink:#111111;
  --text:#111111; --mid:#555555; --muted:#949494; --dim:#cccccc; --border:#e2e1da;
  --good:#2f7a4f; --bad:#b3382c; --warn:#a67c2e; --accent:#2b4a6f;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.75;}
h1,h2,h3,.section-label,.hero-eyebrow,.stat-label,.tl-year,.block-label,.eyebrow{font-family:'Poppins','Noto Sans JP',sans-serif;}
.hero{background:var(--ink);padding:56px 40px 40px;}
.hero-inner{max-width:860px;margin:0 auto;}
.hero-eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:12px;font-weight:600;}
.hero h1{font-size:clamp(24px,4vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#fff;margin-bottom:10px;}
.hero-sub{font-size:13px;color:rgba(255,255,255,.6);line-height:1.7;}
.hero-crumb{font-size:12px;color:rgba(255,255,255,.45);margin-bottom:14px;}
.hero-crumb a{color:rgba(255,255,255,.65);text-decoration:none;}
.hero-crumb a:hover{color:#fff;}
.wrap{max-width:860px;margin:0 auto;padding:40px 40px 90px;}
@media (max-width:640px){.hero{padding:36px 20px 28px;} .wrap{padding:28px 20px 64px;}}
.block{margin-top:40px;}
.block:first-child{margin-top:0;}
.block-label{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.index-folder-list{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:8px 0;}
.index-folder-list a{display:block;border:1px solid var(--border);border-radius:10px;padding:18px 20px;text-decoration:none;color:var(--text);background:var(--surface);}
.index-folder-list a:hover{border-color:var(--ink);}
.index-folder-list .index-folder-title{font-size:13.5px;font-weight:700;margin-bottom:4px;}
.index-folder-list .index-folder-count{font-size:11.5px;color:var(--muted);}
.index-list{list-style:none;border-top:1px solid var(--border);}
.index-list li{border-bottom:1px solid var(--border);}
.index-list a{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 4px;text-decoration:none;color:var(--text);}
.index-list a:hover .index-title{color:var(--accent);}
.index-title{font-size:14px;font-weight:700;letter-spacing:-.01em;}
.index-date{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;}
.empty-note{font-size:13px;color:var(--muted);padding:16px 0;}
.back-link{display:inline-block;margin-top:36px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;}
.back-link:hover{color:var(--mid);}
.page-footer{border-top:1px solid var(--border);padding-top:20px;margin-top:36px;font-size:11.5px;color:var(--muted);line-height:1.8;}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-inner">
    
    <div class="hero-eyebrow">RESEARCH NOTES</div>
    <h1>Koshikawa Research Notes</h1>
  </div>
</div>
<div class="wrap">
  <div class="block"><div class="block-label">Folders</div><div class="index-folder-list"><a href="23_Travel/index.html"><div class="index-folder-title">23_Travel</div><div class="index-folder-count">12件</div></a><a href="24_Research/index.html"><div class="index-folder-title">24_Research</div><div class="index-folder-count">9件</div></a><a href="26_Books/index.html"><div class="index-folder-title">26_Books</div><div class="index-folder-count">1件</div></a></div></div>
  
  <div class="page-footer">Koshikawa Research Notes &mdash; personal knowledge base, published via GitHub Pages.</div>
</div>
</body>
</html>
